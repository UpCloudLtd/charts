apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    addonmanager.kubernetes.io/mode: Reconcile
    umami.upcloud.com/app: konnectivity-agent
  namespace: kube-system
  name: konnectivity-agent
spec:
  selector:
    matchLabels:
      umami.upcloud.com/app: konnectivity-agent
  template:
    metadata:
      labels:
        umami.upcloud.com/app: konnectivity-agent
    spec:
      priorityClassName: system-cluster-critical
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      containers:
        - image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          name: konnectivity-agent
          command: ["/proxy-agent"]
          args: [
                  "--logtostderr=true",
                  "--ca-cert=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt",
                  "--proxy-server-host={{ .Values.proxyServer.host }}",
                  "--proxy-server-port={{ .Values.proxyServer.port }}",
                  "--admin-server-port={{ .Values.adminServer.port }}",
                  "--health-server-port={{ .Values.healthServer.port }}",
                  "--service-account-token-path=/var/run/secrets/tokens/konnectivity-agent-token",
                  "--probe-interval={{ .Values.options.probeInterval }}",
                  "--sync-interval={{ .Values.options.syncInterval }}",
                  "--sync-interval-cap={{ .Values.options.syncIntervalCap }}",
                  "--sync-forever={{ .Values.options.syncForever }}",
                  "--count-server-leases={{ .Values.options.countServerLeases }}"
                  ]
          volumeMounts:
            - mountPath: /var/run/secrets/tokens
              name: konnectivity-agent-token
          livenessProbe:
            httpGet:
              port: {{ .Values.healthServer.port }}
              path: /healthz
            initialDelaySeconds: 15
            timeoutSeconds: 15
      serviceAccountName: konnectivity-agent
      volumes:
        - name: konnectivity-agent-token
          projected:
            sources:
              - serviceAccountToken:
                  path: konnectivity-agent-token
                  audience: system:konnectivity-server
